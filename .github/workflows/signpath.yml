
name: Build and Sign Kinovea

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  VERSION: 2026.1.0

jobs:
  build-and-sign:
    if: github.repository == 'Kinovea/Kinovea'
    runs-on: windows-latest

    steps:
    # --------------------------------------------------
    # Build Kinovea
    # --------------------------------------------------

    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore Kinovea.VS2019.sln

    - name: Cache extra dependencies
      id: extra-deps-cache
      uses: actions/cache@v4
      with:
        path: Refs/FFmpeg
        key: ${{ runner.os }}-extra-deps-${{ hashFiles('Refs/get-dependencies.ps1') }}

    - name: Get extra dependencies
      if: steps.extra-deps-cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: ./Refs/get-dependencies.ps1

    - name: Build Solution
      run: msbuild Kinovea.VS2019.sln /p:Platform="x64" /p:Configuration=Release /p:AllowedReferenceRelatedFileExtensions=none

    - name: Install NSIS
      uses: repolevedavaj/install-nsis@v1.2.0
      with:
        nsis-version: '3.11'

    # --------------------------------------------------
    # First NSIS pass: export the unsigned uninstaller
    # --------------------------------------------------

    - name: Export NSIS uninstaller
      shell: pwsh
      run: |
        makensis /DEXPORT_UNINST Installer/Kinovea.nsi
        if ($LASTEXITCODE -ne 0) {
          throw "NSIS export failed."
        }

        if (-not (Test-Path "Installer/Uninstall-Kinovea.exe")) {
          throw "Exported uninstaller not found."
        }

    # --------------------------------------------------
    # First SignPath request: application + uninstaller
    # --------------------------------------------------

    - name: Prepare signing package
      shell: pwsh
      run: ./Installer/prepare-signing.ps1

    # We don't make our own zip of the input files, github action will do this already.
    - name: Upload unsigned binaries
      id: unsigned-binaries
      uses: actions/upload-artifact@v6
      with:
        name: kinovea-unsigned-binaries
        path: signing-input/
        if-no-files-found: error
        retention-days: 1

    - name: Sign Kinovea binaries
      uses: signpath/github-action-submit-signing-request@v3
      with:
        api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        project-slug: kinovea
        signing-policy-slug: test-signing
        artifact-configuration-slug: kinovea-binaries
        github-artifact-id: ${{ steps.unsigned-binaries.outputs.artifact-id }}
        wait-for-completion: true
        output-artifact-directory: signing-output

    # Move the signed binaries back to their original location so 
    # that the portable and installer builds will use the signed versions.
    - name: Restore signed binaries
      shell: pwsh
      run: |
        $source = (Resolve-Path "signing-output").Path
        $target = "Kinovea/bin/x64/Release"

        # Restore every expected application file.
        Get-ChildItem "signing-input" -Recurse -File |
          Where-Object { $_.Name -ne "Uninstall-Kinovea.exe" } |
          ForEach-Object {
            $relative = $_.FullName.Substring(
              (Resolve-Path "signing-input").Path.Length
            ).TrimStart('\', '/')

            $signed = Join-Path $source $relative

            if (-not (Test-Path -LiteralPath $signed)) {
              throw "Signed file missing: $relative"
            }

            $destination = Join-Path $target $relative
            Copy-Item -LiteralPath $signed -Destination $destination -Force
          }

        # Restore the signed uninstaller.
        $uninstaller = Join-Path $source "Uninstall-Kinovea.exe"

        if (-not (Test-Path $uninstaller)) {
          throw "Signed uninstaller missing."
        }

        Copy-Item $uninstaller `
          "Installer/Uninstall-Kinovea.exe" -Force

    # --------------------------------------------------
    # Produce signed portable distribution
    # --------------------------------------------------

    - name: Prepare Portable build
      shell: pwsh
      run: |
        $appData = "Kinovea/bin/x64/Release/AppData"
        New-Item -ItemType Directory -Force -Path $appData | Out-Null
        New-Item -ItemType File -Force -Path "$appData/portable" | Out-Null

    - name: Create Portable Archive
      shell: pwsh
      run: |
        Compress-Archive `
          -Path "Kinovea/bin/x64/Release/*" `
          -DestinationPath "Kinovea-Portable-${{ env.VERSION }}.zip"

    - name: Upload Portable
      uses: actions/upload-artifact@v6
      with:
        name: Kinovea-Portable-Signed-${{ env.VERSION }}
        path: Kinovea-Portable-${{ env.VERSION }}.zip
        if-no-files-found: error

    - name: Remove Portable AppData Folder
      shell: pwsh
      run: |
        Remove-Item -Recurse -Force `
          "Kinovea/bin/x64/Release/AppData"

    # --------------------------------------------------
    # Second NSIS pass: import signed uninstaller
    # --------------------------------------------------

    - name: Build final installer
      shell: pwsh
      run: |
        makensis /DIMPORT_UNINST Installer/Kinovea.nsi

        if ($LASTEXITCODE -ne 0) {
          throw "NSIS import build failed."
        }

    # --------------------------------------------------
    # Second SignPath request: final installer
    # --------------------------------------------------

    - name: Upload unsigned installer
      id: unsigned-installer
      uses: actions/upload-artifact@v6
      with:
        name: kinovea-unsigned-installer
        path: Installer/Kinovea-${{ env.VERSION }}.exe
        if-no-files-found: error
        retention-days: 1

    - name: Sign final installer
      uses: signpath/github-action-submit-signing-request@v3
      with:
        api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        project-slug: kinovea
        signing-policy-slug: test-signing
        artifact-configuration-slug: kinovea-installer
        github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
        wait-for-completion: true
        output-artifact-directory: signing-output-installer

    - name: Upload Signed Installer
      uses: actions/upload-artifact@v6
      with:
        name: Kinovea-Installer-Signed-${{ env.VERSION }}
        path: signing-output-installer/Kinovea-${{ env.VERSION }}.exe
        if-no-files-found: error
